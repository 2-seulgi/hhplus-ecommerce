server:
  port: 8081

spring:
  application:
    name: ecommerce
  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    open-in-view: false
    show-sql: false  # datasource-proxy가 대신 찍으므로 false
    hibernate:
      ddl-auto: update  # Flyway 제거하고 JPA로 스키마 관리
      default-batch-fetch-size: 100
    defer-datasource-initialization: true  # JPA 스키마 생성 후 data.sql 실행

    properties:
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: false  # Flyway 비활성화

  # Kafka 설정
  # 세부 설정은 KafkaProducerConfig, KafkaErrorHandlingConfig에서 관리
  kafka:
    bootstrap-servers: localhost:9092  # Kafka 브로커 주소 (환경별로 다를 수 있음)
    consumer:
      # Consumer별 설정 (환경별 튜닝 가능)
      # concurrency: 파티션 수 이하로 설정 (파티션 수보다 많으면 스레드 낭비)
      order-data-platform:
        group-id: ecommerce-order-consumer-group
        concurrency: 3  # order.confirmed 토픽 파티션 수에 맞춤
      order-notification:
        group-id: ecommerce-notification-consumer-group
        concurrency: 3  # order.confirmed 토픽 파티션 수에 맞춤
      coupon-notification:
        group-id: ecommerce-coupon-notification-consumer-group
        concurrency: 3  # coupon.issued 토픽 파티션 수에 맞춤
      coupon-log:
        group-id: ecommerce-coupon-log-consumer-group
        concurrency: 3  # coupon.issued 토픽 파티션 수에 맞춤
      order-dlt:
        group-id: ecommerce-order-dlt-consumer-group
        concurrency: 1  # DLT는 단일 스레드 처리 권장 (순차 복구)
      # 기본 설정 (fallback)
      default-concurrency: 3

logging:
  level:
    p6spy: DEBUG

# 쿠폰 발급 큐 설정
coupon:
  stream:
    consumer-group: coupon-consumer-group  # Redis Stream Consumer Group 이름
    consumer-name: consumer-1               # Consumer 인스턴스 이름 (수평 확장 시 변경 해야함)
