spring:
  application:
    name: ecommerce

  flyway:
    enabled: false  # 테스트에서는 JPA DDL로 스키마 생성

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:tc:mysql:8.0:///test  # 👈 TestContainer placeholder

    # URL/ID/PW는 Testcontainers가 override

  data:
    redis:
      # host와 port는 Testcontainers가 override
      timeout: 3000ms

  jpa:
    open-in-view: false
    show-sql: false  # datasource-proxy가 대신 찍으므로 false
    hibernate:
      ddl-auto: create-drop
      default-batch-fetch-size: 100
    properties:
      hibernate.format_sql: true
      hibernate.generate_statistics: false  # 성능 통계

logging:
  level:
    p6spy: DEBUG
    org.hibernate.stat: OFF

# 쿠폰 발급 큐 설정
coupon:
  stream:
    consumer-group: coupon-consumer-group-test
    consumer-name: consumer-test-1

